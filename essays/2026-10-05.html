  <style>
    :root { color-scheme: dark light; }
    html { background: #16111f; }
    html[data-theme="light"] { background: #f7f2eb; }
    body { margin: 0; }
  </style>

  <script>
    (function () {
      var t = localStorage.getItem('theme-preference') || 'system';
      var d = t === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : t;
      document.documentElement.setAttribute('data-theme', d);
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../vendor/font-awesome/css/all.min.css" />

      <button class="theme-btn" data-theme-value="light" title="亮色"><i class="fas fa-sun"></i></button>
      <button class="theme-btn" data-theme-value="dark" title="暗色"><i class="fas fa-moon"></i></button>
