<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>胖宝关于</title>

  <!-- 防止白屏：CSS 加载前先给正确的背景色 -->
  <style>
    html { background: #1a1029; }
    html[data-theme="light"] { background: #faf0e6; }
    body { margin: 0; }
  </style>

  <!-- 尽早应用主题，避免深浅色闪烁 -->
  <script>
    (function () {
      var t = localStorage.getItem('theme-preference') || 'system';
      var d = t === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : t;
      document.documentElement.setAttribute('data-theme', d);
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- 本地 Font Awesome -->
  <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="post.css" />
</head>
<body>
  <aside id="toc-sidebar" class="toc-sidebar"></aside>

  <div class="container">

    <nav class="navbar">
      <div class="nav-brand">胖宝基地</div>
      <div class="nav-right">
        <div class="nav-links">
          <a href="index.html">首页</a>
          <a href="about.html">关于</a>
          <a href="index.html#contact">
            <i class="fas fa-paw" style="margin-right: 6px; color: var(--accent);"></i>去联系胖宝
          </a>
        </div>
        <div class="theme-switcher" id="themeSwitcher">
          <button class="theme-btn" data-theme-value="light" title="亮色"><i class="fas fa-sun"></i></button>
          <button class="theme-btn" data-theme-value="dark" title="暗色"><i class="fas fa-moon"></i></button>
          <button class="theme-btn" data-theme-value="system" title="跟随系统"><i class="fas fa-desktop"></i></button>
        </div>
      </div>
    </nav>

    <article class="post" id="post-content">
      <p class="post-loading">加载中…</p>
    </article>

    <div class="footer">
      &copy; 2026 <span>PangBao</span> · powerd by 画画力一族
    </div>

  </div>

  <!-- 改为本地 marked 和本地脚本，使用 defer 避免阻塞 -->
  <script defer src="vendor/marked.min.js"></script>
  <script defer src="script.js"></script>
  <script defer src="post.js"></script>
</body>
</html>
